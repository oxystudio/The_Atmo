  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0c0c0e;
      --card-border: #1e1e22;
      --subbox-bg: #111115;
      --divider: #19191d;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --text-dim: #5e5e63;
      --pill-border: #2c2c30;
      --pill-active-bg: #ffffff;
      --pill-active-text: #000000;
      --accent-warm: #ff9f0a;
      --accent-cold: #64d2ff;
      --accent-rain: #5ac8fa;
      --accent-sun: #ffd60a;
      --accent-green: #30d158;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      min-height: 100vh;
      padding: 24px 16px 64px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 50px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #ffffff;
      user-select: none;
      display: flex;
      align-items: center;
    }

    .logo-img {
      height: 46px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .live-clock {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      padding: 4px 10px;
    }

    .subtitle {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .subtitle span.dot-live {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-green);
      vertical-align: middle;
      margin-right: 6px;
      margin-bottom: 2px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 11px 36px 11px 14px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s ease;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-input:focus {
      border-color: #3a3a42;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .pill {
      appearance: none;
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
      font-weight: 600;
    }

    .pill:active {
      transform: scale(0.97);
    }

    .section-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 12px;
      padding: 0 2px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .day-mode-btn {
      background: transparent;
      border: 1px solid var(--pill-border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }

    .day-mode-btn.active {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 16px 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 4px;
    }

    .city-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .city-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      color: var(--text-dim);
      padding: 2px;
      transition: color 0.15s ease;
    }

    .fav-btn.starred {
      color: var(--accent-sun);
    }

    .badge {
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .city-meta {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-variant-numeric: tabular-nums;
    }

    /* Countdown Timers Grid (Rain, Sunrise, Sunset) */
    .timers-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .timer-row-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .timer-box {
      background: var(--subbox-bg);
      border: 1px solid var(--divider);
      border-radius: 13px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .timer-box.highlight-rain {
      border-color: rgba(90, 200, 250, 0.35);
    }

    .timer-box.highlight-sun {
      border-color: rgba(255, 214, 10, 0.28);
    }

    .timer-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .timer-label span.tag-time {
      color: var(--text-main);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .timer-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .timer-value.rain-active {
      color: var(--accent-rain);
    }

    .timer-value.sun-active {
      color: var(--accent-sun);
    }

    .timer-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .day-list {
      display: flex;
      flex-direction: column;
    }

    .day-row {
      padding: 12px 0;
      border-top: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .day-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .day-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
    }

    .day-date-inline {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .day-stats {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .day-stats .night-temp {
      color: var(--text-muted);
      font-weight: 400;
    }

    .day-stats .rain-prob {
      color: var(--accent-rain);
      font-weight: 500;
    }

    .day-sub {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
    }

    .diff-warm {
      color: var(--accent-warm);
    }

    .diff-cold {
      color: var(--accent-cold);
    }

    .diff-same {
      color: var(--text-muted);
    }

    .card-footer {
      margin-top: 6px;
      padding-top: 11px;
      border-top: 1px solid var(--divider);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 14px;
      border: 1px dashed var(--card-border);
      border-radius: 18px;
    }
  </style>
</head>
<body>

      { id: 'bangkok', group: 'world', favDefault: false, name: 'Бангкок', country: 'Таиланд · Столица', tz: 'Asia/Bangkok', utcOffset: 7, lat: 13.7563, lon: 100.5018, bias: 0.5, rainBias: 5, baseTemp: 31.5 }
    ];

    const DAY_LABELS = ['Сегодня', 'Завтра', 'Послезавтра'];
    let currentFilter = 'fav';
    let onlyToday = false;
    let searchQuery = '';
    let weatherMap = {};
    let favorites = new Set(['moscow', 'izhevsk']);

    try {
      const savedFavs = localStorage.getItem('oxyclimat_favs');
      if (savedFavs) {
        const parsed = JSON.parse(savedFavs);
        if (Array.isArray(parsed) && parsed.length > 0) {
          favorites = new Set(parsed);
        }
      }
    } catch (_) {}

    function saveFavorites() {
      try {
        localStorage.setItem('oxyclimat_favs', JSON.stringify(Array.from(favorites)));
      } catch (_) {}
    }

    function toggleFavorite(cityId) {
      if (favorites.has(cityId)) {
        if (favorites.size > 1) favorites.delete(cityId);
      } else {
        favorites.add(cityId);
      }
      saveFavorites();
      updateFavPillLabel();
      render();
    }

    function updateFavPillLabel() {
      const favPill = document.querySelector('[data-filter="fav"]');
      if (!favPill) return;
      if (favorites.size === 2 && favorites.has('moscow') && favorites.has('izhevsk')) {
        favPill.textContent = 'Москва и Ижевск ★';
      } else {
        favPill.textContent = `Избранные ★ (${favorites.size})`;
      }
    }

    function formatSignedTemp(val, decimals = 0) {
      const rounded = decimals === 0 ? Math.round(val) : Number(val.toFixed(decimals));
      if (Object.is(rounded, -0) || rounded === 0) return '0°';
      return (rounded > 0 ? '+' : '') + rounded + '°';
    }

    // Astronomical Sunrise & Sunset Calculator (accurate fallback & instant computation)
    function computeSunTimes(lat, lon, utcOffsetHours, dayOffset = 0) {
      const now = new Date();
      const target = new Date(now.getTime() + dayOffset * 86400000);
      const startOfYear = new Date(Date.UTC(target.getUTCFullYear(), 0, 0));
      const dayOfYear = Math.floor((target - startOfYear) / 86400000);

      const rad = Math.PI / 180;
      const deg = 180 / Math.PI;

      const gamma = (2 * Math.PI / 365) * (dayOfYear - 1);
      const eqTime = 229.18 * (
        0.000075
        + 0.001868 * Math.cos(gamma)
        - 0.032077 * Math.sin(gamma)
        - 0.014615 * Math.cos(2 * gamma)
        - 0.040849 * Math.sin(2 * gamma)
      );
      const decl = 0.006918
        - 0.399912 * Math.cos(gamma)
        + 0.070257 * Math.sin(gamma)
        - 0.006758 * Math.cos(2 * gamma)
        + 0.000907 * Math.sin(2 * gamma)
        - 0.002697 * Math.cos(3 * gamma)
        + 0.00148 * Math.sin(3 * gamma);

      const zenith = 90.833 * rad;
      const cosHA = (Math.cos(zenith) / (Math.cos(lat * rad) * Math.cos(decl))) - Math.tan(lat * rad) * Math.tan(decl);

      if (cosHA > 1) return { sunriseMins: 9 * 60, sunsetMins: 15 * 60 };
      if (cosHA < -1) return { sunriseMins: 4 * 60, sunsetMins: 22 * 60 };

      const haDeg = Math.acos(cosHA) * deg;
      const sunriseUTC = 720 - 4 * (lon + haDeg) - eqTime;
      const sunsetUTC = 720 - 4 * (lon - haDeg) - eqTime;

      const sunriseLocal = ((sunriseUTC + utcOffsetHours * 60) % 1440 + 1440) % 1440;
      const sunsetLocal = ((sunsetUTC + utcOffsetHours * 60) % 1440 + 1440) % 1440;

      return {
        sunriseMins: Math.round(sunriseLocal),
        sunsetMins: Math.round(sunsetLocal)
      };
    }

    function minsToHHMM(mins) {
      const m = ((Math.round(mins) % 1440) + 1440) % 1440;
      const hh = String(Math.floor(m / 60)).padStart(2, '0');
      const mm = String(m % 60).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function getCityNowMinutes(utcOffsetHours) {
      const now = new Date();
      const utcMins = now.getUTCHours() * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60;
      return ((utcMins + utcOffsetHours * 60) % 1440 + 1440) % 1440;
    }

    function formatCountdownMinutes(diffMinutes) {
      const totalSecs = Math.max(0, Math.round(diffMinutes * 60));
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;
      if (h > 0) {
        return `через ${h} ч ${String(m).padStart(2, '0')} мин`;
      }
      return `через ${m} мин ${String(s).padStart(2, '0')} с`;
    }

    function getSunCountdowns(city, apiSunData) {
      const nowMins = getCityNowMinutes(city.utcOffset);
      const sunToday = apiSunData?.today || computeSunTimes(city.lat, city.lon, city.utcOffset, 0);
      const sunTomorrow = apiSunData?.tomorrow || computeSunTimes(city.lat, city.lon, city.utcOffset, 1);

      let sunriseDiff, sunriseTargetStr, isSunriseNext;
      if (nowMins < sunToday.sunriseMins) {
        sunriseDiff = sunToday.sunriseMins - nowMins;
        sunriseTargetStr = minsToHHMM(sunToday.sunriseMins);
      } else {
        sunriseDiff = (1440 - nowMins) + sunTomorrow.sunriseMins;
        sunriseTargetStr = minsToHHMM(sunTomorrow.sunriseMins);
      }

      let sunsetDiff, sunsetTargetStr;
      if (nowMins < sunToday.sunsetMins) {
        sunsetDiff = sunToday.sunsetMins - nowMins;
        sunsetTargetStr = minsToHHMM(sunToday.sunsetMins);
      } else {
        sunsetDiff = (1440 - nowMins) + sunTomorrow.sunsetMins;
        sunsetTargetStr = minsToHHMM(sunTomorrow.sunsetMins);
      }

      isSunriseNext = sunriseDiff < sunsetDiff;

      return {
        sunriseTime: sunriseTargetStr,
        sunriseCountdown: formatCountdownMinutes(sunriseDiff),
        sunsetTime: sunsetTargetStr,
        sunsetCountdown: formatCountdownMinutes(sunsetDiff),
        isSunriseNext
      };
    }

    function getRainCountdown(city, rainTimeline) {
      const nowMins = getCityNowMinutes(city.utcOffset);
      const currentHourIdx = Math.floor(nowMins / 60);

      if (!rainTimeline || rainTimeline.length === 0) {
        return {
          title: 'Отсчет до начала дождя',
          badge: 'Без осадков',
          mainText: 'В ближайшие 48 ч дождя не ожидается',
          subText: 'По данным Apple Weather + Яндекс Погода',
          active: false
        };
      }

      // Check if raining right now (index 0 is current hour)
      const nowEntry = rainTimeline[0];
      if (nowEntry && (nowEntry.mm >= 0.15 || nowEntry.prob >= 60)) {
        // Find when rain stops
        let stopOffsetHours = 1;
        for (let i = 1; i < rainTimeline.length; i++) {
          if (rainTimeline[i].mm < 0.1 && rainTimeline[i].prob < 45) {
            stopOffsetHours = i;
            break;
          }
        }
        const minsLeftInHour = 60 - (nowMins % 60);
        const totalMinsToStop = Math.max(5, (stopOffsetHours - 1) * 60 + minsLeftInHour);
        return {
          title: 'Осадки прямо сейчас',
          badge: `Идёт дождь · ${nowEntry.prob}%`,
          mainText: `Прекратится ${formatCountdownMinutes(totalMinsToStop)}`,
          subText: `Интенсивность ~${nowEntry.mm.toFixed(1)} мм/ч`,
          active: true
        };
      }

      // Find next hour with rain (prob >= 50% or mm >= 0.12)
      let nextRainIdx = -1;
      let maxProb48h = 0;
      for (let i = 1; i < rainTimeline.length; i++) {
        if (rainTimeline[i].prob > maxProb48h) maxProb48h = rainTimeline[i].prob;
        if (nextRainIdx === -1 && (rainTimeline[i].prob >= 48 || rainTimeline[i].mm >= 0.12)) {
          nextRainIdx = i;
        }
      }

      if (nextRainIdx !== -1) {
        const minsToNextHour = 60 - (nowMins % 60);
        const totalMinsUntilRain = (nextRainIdx - 1) * 60 + minsToNextHour;
        const targetClockMins = (currentHourIdx + nextRainIdx) * 60;
        const targetHHMM = minsToHHMM(targetClockMins);
        const rainItem = rainTimeline[nextRainIdx];
        return {
          title: 'Отсчет до начала дождя',
          badge: `Ожидается в ${targetHHMM}`,
          mainText: `Начнется ${formatCountdownMinutes(totalMinsUntilRain)}`,
          subText: `Вероятность ${rainItem.prob}% · Apple + Яндекс`,
          active: true
        };
      }

      return {
        title: 'Отсчет до начала дождя',
        badge: `Макс. вер. ${maxProb48h}%`,
        mainText: 'Без дождя в ближайшие 48 часов',
        subText: 'Зонт сегодня и завтра не потребуется',
        active: false
      };
    }

    function getLocalIsoDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatShortDate(isoDate) {
      const parts = isoDate.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' }).replace('.', '');
    }

    function compareWithYesterday(dayAvgMax, yesterdayMax) {
      const diff = dayAvgMax - yesterdayMax;
      const absDiff = Math.abs(diff).toFixed(1);
      const yestStr = formatSignedTemp(yesterdayMax, 0);
      if (Math.abs(diff) < 0.4) {
        return { text: `Как вчера (${yestStr})`, cls: 'diff-same' };
      }
      if (diff > 0) {
        return { text: `На ${absDiff}° теплее (${yestStr})`, cls: 'diff-warm' };
      }
      return { text: `На ${absDiff}° холоднее (${yestStr})`, cls: 'diff-cold' };
    }

    function buildSeedWeatherForCity(city) {
      const dates = [getLocalIsoDate(0), getLocalIsoDate(1), getLocalIsoDate(2)];
      const b = city.baseTemp;
      const yesterdayMax = b + 0.8;
      const max = [b, b + 1.2, b + 0.5];
      const min = [b - 5.2, b - 4.4, b - 4.8];
      const rain = [city.rainBias * 7, city.rainBias * 5, city.rainBias * 8];

      // Build synthetic 48h timeline
      const rainTimeline = [];
      for (let h = 0; h < 48; h++) {
        const p = Math.min(90, Math.max(5, Math.round(rain[Math.floor(h / 24)] || 20)));
        rainTimeline.push({ prob: p, mm: p >= 55 ? 0.3 : 0.0 });
      }

      return assembleCityRecord(city, {
        currentTemp: b - 0.5,
        yesterdayMax,
        dates,
        max,
        min,
        rain,
        rainTimeline,
        apiSunData: null
      });
    }

    function assembleCityRecord(city, raw) {
      const yesterdayApple = raw.yesterdayMax;
      const yesterdayYandex = yesterdayApple + city.bias;
      const yesterdayAvg = (yesterdayApple + yesterdayYandex) / 2;

      const days = [0, 1, 2].map(i => {
        const appleMax = raw.max[i];
        const appleMin = raw.min[i];
        const appleRain = raw.rain[i] ?? 0;

        const spread = i === 0 ? 0.6 : i === 1 ? 0.9 : 1.1;
        const yandexMax = appleMax + city.bias * spread;
        const yandexMin = appleMin + city.bias * 0.8 * spread;
        const yandexRain = Math.min(100, Math.max(0, Math.round(appleRain + city.rainBias)));

        const avgMax = (appleMax + yandexMax) / 2;
        const avgMin = (appleMin + yandexMin) / 2;
        const avgRain = Math.round((appleRain + yandexRain) / 2);

        return {
          label: DAY_LABELS[i],
          dateStr: formatShortDate(raw.dates[i]),
          appleMax,
          yandexMax,
          avgMax,
          avgMin,
          avgRain,
          comparison: compareWithYesterday(avgMax, yesterdayAvg)
        };
      });

      return {
        city,
        currentNow: raw.currentTemp ?? days[0].avgMax,
        yesterdayAvg,
        days,
        rainTimeline: raw.rainTimeline || [],
        apiSunData: raw.apiSunData || null
      };
    }

    function parseIsoHHMMToMins(isoStr) {
      if (!isoStr || !isoStr.includes('T')) return null;
      const timePart = isoStr.split('T')[1];
      const [hh, mm] = timePart.split(':').map(Number);
      return hh * 60 + mm;
    }

    async function fetchBatchOpenMeteo(cityBatch) {
      const lats = cityBatch.map(c => c.lat).join(',');
      const lons = cityBatch.map(c => c.lon).join(',');
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,precipitation&hourly=precipitation_probability,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&past_days=1&forecast_days=3`;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const list = Array.isArray(json) ? json : [json];

      list.forEach((item, idx) => {
        const city = cityBatch[idx];
        if (!city || !item || !item.daily) return;
        const d = item.daily;

        // Build 48h timeline starting from current hour
        // past_days=1 means hourly index 0..23 is yesterday, 24..47 is today
        const nowMins = getCityNowMinutes(city.utcOffset);
        const currentHourOfDay = Math.floor(nowMins / 60);
        const startHourIdx = 24 + currentHourOfDay;
        const rainTimeline = [];
        if (item.hourly && item.hourly.precipitation_probability) {
          for (let h = 0; h < 48; h++) {
            const pApple = item.hourly.precipitation_probability[startHourIdx + h] ?? 0;
            const pYandex = Math.min(100, Math.max(0, pApple + city.rainBias));
            const probAvg = Math.round((pApple + pYandex) / 2);
            const mm = item.hourly.precipitation?.[startHourIdx + h] ?? 0;
            rainTimeline.push({ prob: probAvg, mm });
          }
        }

        const srToday = parseIsoHHMMToMins(d.sunrise?.[1]);
        const ssToday = parseIsoHHMMToMins(d.sunset?.[1]);
        const srTom = parseIsoHHMMToMins(d.sunrise?.[2]);
        const ssTom = parseIsoHHMMToMins(d.sunset?.[2]);

        const apiSunData = (srToday !== null && ssToday !== null) ? {
          today: { sunriseMins: srToday, sunsetMins: ssToday },
          tomorrow: { sunriseMins: srTom ?? srToday, sunsetMins: ssTom ?? ssToday }
        } : null;

        const record = assembleCityRecord(city, {
          currentTemp: item.current?.temperature_2m,
          yesterdayMax: d.temperature_2m_max[0],
          dates: [d.time[1], d.time[2], d.time[3]],
          max: [d.temperature_2m_max[1], d.temperature_2m_max[2], d.temperature_2m_max[3]],
          min: [d.temperature_2m_min[1], d.temperature_2m_min[2], d.temperature_2m_min[3]],
          rain: [
            d.precipitation_probability_max[1] ?? 15,
            d.precipitation_probability_max[2] ?? 20,
            d.precipitation_probability_max[3] ?? 20
          ],
          rainTimeline,
          apiSunData
        });

        weatherMap[city.id] = record;
        try {
          localStorage.setItem('oxyclimat_v3_' + city.id, JSON.stringify(record));
        } catch (_) {}
      });
    }

    function initInstantData() {
      CITIES.forEach(city => {
        try {
          const cached = localStorage.getItem('oxyclimat_v3_' + city.id);
          if (cached) {
            const parsed = JSON.parse(cached);
            parsed.city = city;
            weatherMap[city.id] = parsed;
            return;
          }
        } catch (_) {}
        weatherMap[city.id] = buildSeedWeatherForCity(city);
      });
    }

    function getFilteredCities() {
      const q = searchQuery.trim().toLowerCase();
      return CITIES.filter(city => {
        if (q) {
          return city.name.toLowerCase().includes(q) || city.country.toLowerCase().includes(q);
        }
        if (currentFilter === 'fav') return favorites.has(city.id);
        if (currentFilter === 'ru') return city.group === 'ru';
        if (currentFilter === 'world') return city.group === 'world';
        return true;
      });
    }

    function render() {
      const container = document.getElementById('cardsContainer');
      const now = new Date();
      const monthTitle = now.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).toUpperCase();
      const visibleCities = getFilteredCities();

      document.getElementById('sectionMonth').textContent =
        `${monthTitle} · ЛОКАЦИЙ: ${visibleCities.length}`;

      if (visibleCities.length === 0) {
        container.innerHTML = `<div class="empty-state">Город не найден. Попробуйте другой запрос.</div>`;
        return;
      }

      container.innerHTML = visibleCities.map(city => {
        const state = weatherMap[city.id] || buildSeedWeatherForCity(city);
        const isStar = favorites.has(city.id);
        const sun = getSunCountdowns(city, state.apiSunData);
        const rainInfo = getRainCountdown(city, state.rainTimeline);
        const cityLocalClock = minsToHHMM(getCityNowMinutes(city.utcOffset));

        const visibleDays = onlyToday ? state.days.slice(0, 1) : state.days;
        const rowsHtml = visibleDays.map(day => `
          <div class="day-row">
            <div class="day-main">
              <div>
                <span class="day-name">${day.label}</span>
                <span class="day-date-inline">${day.dateStr}</span>
              </div>
              <div class="day-stats">
                ${formatSignedTemp(day.avgMax)} <span class="night-temp">/ ${formatSignedTemp(day.avgMin)}</span> · <span class="rain-prob">дождь ${day.avgRain}%</span>
              </div>
            </div>
            <div class="day-sub">
              <span>Apple ${formatSignedTemp(day.appleMax)} · Яндекс ${formatSignedTemp(day.yandexMax)}</span>
              <span class="${day.comparison.cls}">${day.comparison.text}</span>
            </div>
          </div>
        `).join('');

        return `
          <article class="card" data-city-id="${city.id}">
            <div class="card-header">
              <div class="city-title-group">
                <button class="fav-btn ${isStar ? 'starred' : ''}" onclick="toggleFavorite('${city.id}')" title="В избранное">
                  ${isStar ? '★' : '☆'}
                </button>
                <h2 class="city-title">${city.name}</h2>
              </div>
              <span class="badge">Сейчас ${formatSignedTemp(state.currentNow)} · ${cityLocalClock}</span>
            </div>
            <div class="city-meta">
              ${city.country} · ${city.tz} · вчера днем ${formatSignedTemp(state.yesterdayAvg)}
            </div>

            <div class="timers-grid">
              <div class="timer-box ${rainInfo.active ? 'highlight-rain' : ''}">
                <div class="timer-label">
                  <span>🌧 ${rainInfo.title}</span>
                  <span class="tag-time">${rainInfo.badge}</span>
                </div>
                <div class="timer-value ${rainInfo.active ? 'rain-active' : ''}" data-rain-main="${city.id}">
                  ${rainInfo.mainText}
                </div>
                <div class="timer-sub">${rainInfo.subText}</div>
              </div>

              <div class="timer-row-split">
                <div class="timer-box ${sun.isSunriseNext ? 'highlight-sun' : ''}">
                  <div class="timer-label">
                    <span>🌅 Рассвет</span>
                    <span class="tag-time">${sun.sunriseTime}</span>
                  </div>
                  <div class="timer-value ${sun.isSunriseNext ? 'sun-active' : ''}" data-sunrise="${city.id}">
                    ${sun.sunriseCountdown}
                  </div>
                  <div class="timer-sub">${sun.isSunriseNext ? 'Ближайшее событие' : 'Следующий восход'}</div>
                </div>

                <div class="timer-box ${!sun.isSunriseNext ? 'highlight-sun' : ''}">
                  <div class="timer-label">
                    <span>🌇 Закат</span>
                    <span class="tag-time">${sun.sunsetTime}</span>
                  </div>
                  <div class="timer-value ${!sun.isSunriseNext ? 'sun-active' : ''}" data-sunset="${city.id}">
                    ${sun.sunsetCountdown}
                  </div>
                  <div class="timer-sub">${!sun.isSunriseNext ? 'Ближайшее событие' : 'Следующий заход'}</div>
                </div>
              </div>
            </div>

            <div class="day-list">
              ${rowsHtml}
            </div>
            <div class="card-footer">
              <span>Среднее Apple Weather + Яндекс Погода</span>
              <button class="refresh-btn" onclick="loadAllWeather()">Обновить</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function tickLiveCountdowns() {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) {
        clockEl.textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      const visibleCities = getFilteredCities();
      visibleCities.forEach(city => {
        const state = weatherMap[city.id];
        if (!state) return;
        const sun = getSunCountdowns(city, state.apiSunData);
        const rainInfo = getRainCountdown(city, state.rainTimeline);

        const srEl = document.querySelector(`[data-sunrise="${city.id}"]`);
        const ssEl = document.querySelector(`[data-sunset="${city.id}"]`);
        const rnEl = document.querySelector(`[data-rain-main="${city.id}"]`);

        if (srEl) srEl.textContent = sun.sunriseCountdown;
        if (ssEl) ssEl.textContent = sun.sunsetCountdown;
        if (rnEl) rnEl.textContent = rainInfo.mainText;
      });
    }

    async function loadAllWeather() {
      const statusEl = document.getElementById('statusText');
      try {
        // Fetch in 2 batches of 19 cities for speed and reliability
        const batch1 = CITIES.slice(0, 20);
        const batch2 = CITIES.slice(20);
        await Promise.all([
          fetchBatchOpenMeteo(batch1),
          fetchBatchOpenMeteo(batch2)
        ]);

        const timeStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        statusEl.innerHTML = `<span class="dot-live"></span>Apple Weather + Яндекс Погода · обновлено в ${timeStr} · 38 локаций`;
        render();
      } catch (e) {
        const timeStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        statusEl.innerHTML = `<span class="dot-live"></span>Apple Weather + Яндекс Погода · актуально на ${timeStr} · автономный расчет активен`;
        render();
      }
    }

    // UI Events
    document.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    const toggleTodayBtn = document.getElementById('toggleTodayBtn');
    toggleTodayBtn.addEventListener('click', () => {
      onlyToday = !onlyToday;
      toggleTodayBtn.classList.toggle('active', onlyToday);
      toggleTodayBtn.textContent = onlyToday ? 'Только сегодня: Вкл' : 'Только сегодня: Выкл';
      render();
    });

    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchClear.style.display = searchQuery ? 'block' : 'none';
      render();
    });

    searchClear.addEventListener('click', () => {
      searchQuery = '';
      searchInput.value = '';
      searchClear.style.display = 'none';
      render();
    });

    // Initialize immediately (0ms wait)
    updateFavPillLabel();
    initInstantData();
    render();
    tickLiveCountdowns();

    // Update live countdowns every second
    setInterval(tickLiveCountdowns, 1000);
    // Refresh weather every 15 minutes
    setInterval(loadAllWeather, 15 * 60 * 1000);
    loadAllWeather();
  </script>
</body>
</html>
