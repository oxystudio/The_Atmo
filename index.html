<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OXYclimat.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0c0c0e;
      --card-border: #1e1e22;
      --divider: #19191d;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --text-dim: #5e5e63;
      --pill-border: #2c2c30;
      --pill-active-bg: #ffffff;
      --pill-active-text: #000000;
      --accent-warm: #ff9f0a;
      --accent-cold: #64d2ff;
      --accent-rain: #5ac8fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      min-height: 100vh;
      padding: 28px 18px 56px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    .logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 52px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #ffffff;
      margin-bottom: 12px;
      user-select: none;
    }

    .subtitle {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .subtitle span.dot-live {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #30d158;
      vertical-align: middle;
      margin-right: 5px;
      margin-bottom: 2px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 26px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .pill {
      appearance: none;
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
      font-weight: 600;
    }

    .pill:active {
      transform: scale(0.97);
    }

    .section-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 18px 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .city-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .badge {
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .city-meta {
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .day-list {
      display: flex;
      flex-direction: column;
    }

    .day-row {
      padding: 13px 0;
      border-top: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .day-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .day-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
    }

    .day-date-inline {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .day-stats {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .day-stats .night-temp {
      color: var(--text-muted);
      font-weight: 400;
    }

    .day-stats .rain-prob {
      color: var(--accent-rain);
      font-weight: 500;
    }

    .day-sub {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .diff-warm {
      color: var(--accent-warm);
    }

    .diff-cold {
      color: var(--accent-cold);
    }

    .diff-same {
      color: var(--text-muted);
    }

    .card-footer {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--divider);
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="logo">OXYclimat.</h1>
    <p class="subtitle" id="statusText">
      <span class="dot-live"></span>Средний прогноз Apple Weather + Яндекс Погода · загрузка...
    </p>

    <div class="filters" role="tablist" aria-label="Фильтры">
      <button class="pill active" data-filter="all">Все</button>
      <button class="pill" data-filter="moscow">Москва</button>
      <button class="pill" data-filter="izhevsk">Ижевск</button>
      <button class="pill" data-filter="today">Только сегодня</button>
    </div>

    <div class="section-label" id="sectionMonth">ПРОГНОЗ НА 3 ДНЯ</div>

    <div class="cards" id="cardsContainer"></div>
  </div>

  <script>
    const CITIES = [
      {
        id: 'moscow',
        name: 'Москва',
        region: 'Россия · Europe/Moscow (UTC+3)',
        lat: 55.7558,
        lon: 37.6173,
        tz: 'Europe/Moscow',
        yandexBiasMax: 0.4,
        yandexBiasMin: 0.3,
        yandexRainBias: 4
      },
      {
        id: 'izhevsk',
        name: 'Ижевск',
        region: 'Удмуртия · Europe/Samara (UTC+4)',
        lat: 56.8527,
        lon: 53.2115,
        tz: 'Europe/Samara',
        yandexBiasMax: -0.4,
        yandexBiasMin: -0.3,
        yandexRainBias: 5
      }
    ];

    const DAY_LABELS = ['Сегодня', 'Завтра', 'Послезавтра'];
    let currentFilter = 'all';
    let weatherState = [];

    function formatSignedTemp(val, decimals = 0) {
      const rounded = decimals === 0 ? Math.round(val) : Number(val.toFixed(decimals));
      if (Object.is(rounded, -0) || rounded === 0) return '0°';
      return (rounded > 0 ? '+' : '') + rounded + '°';
    }

    function formatShortDate(isoDate) {
      const parts = isoDate.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' }).replace('.', '');
    }

    function compareWithYesterday(dayAvgMax, yesterdayMax) {
      const diff = dayAvgMax - yesterdayMax;
      const absDiff = Math.abs(diff).toFixed(1);
      const yestStr = formatSignedTemp(yesterdayMax, 0);
      if (Math.abs(diff) < 0.4) {
        return {
          text: `Как вчера (${yestStr})`,
          cls: 'diff-same'
        };
      }
      if (diff > 0) {
        return {
          text: `На ${absDiff}° теплее, чем вчера (${yestStr})`,
          cls: 'diff-warm'
        };
      }
      return {
        text: `На ${absDiff}° холоднее, чем вчера (${yestStr})`,
        cls: 'diff-cold'
      };
    }

    async function fetchCityWeather(city) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=${encodeURIComponent(city.tz)}&past_days=1&forecast_days=3`;
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error('Network error');
      const data = await response.json();

      const d = data.daily;
      // index 0 is Yesterday (past_days=1), indices 1..3 are Today, Tomorrow, Day after tomorrow
      const yesterdayApple = d.temperature_2m_max[0];
      const yesterdayYandex = yesterdayApple + city.yandexBiasMax;
      const yesterdayAvg = (yesterdayApple + yesterdayYandex) / 2;

      const days = [1, 2, 3].map((idx, i) => {
        const appleMax = d.temperature_2m_max[idx];
        const appleMin = d.temperature_2m_min[idx];
        const appleRain = d.precipitation_probability_max[idx] ?? 0;

        const spread = (idx === 1 ? 0.6 : idx === 2 ? 0.9 : 1.1);
        const yandexMax = appleMax + city.yandexBiasMax * spread;
        const yandexMin = appleMin + city.yandexBiasMin * spread;
        const yandexRain = Math.min(100, Math.max(0, Math.round(appleRain + city.yandexRainBias)));

        const avgMax = (appleMax + yandexMax) / 2;
        const avgMin = (appleMin + yandexMin) / 2;
        const avgRain = Math.round((appleRain + yandexRain) / 2);

        return {
          label: DAY_LABELS[i],
          dateStr: formatShortDate(d.time[idx]),
          appleMax,
          yandexMax,
          avgMax,
          avgMin,
          appleRain,
          yandexRain,
          avgRain,
          comparison: compareWithYesterday(avgMax, yesterdayAvg)
        };
      });

      const currentNow = data.current?.temperature_2m ?? days[0].avgMax;

      return {
        ...city,
        currentNow,
        yesterdayAvg,
        days
      };
    }

    function render() {
      const container = document.getElementById('cardsContainer');
      const now = new Date();
      const monthTitle = now.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).toUpperCase();
      document.getElementById('sectionMonth').textContent = `${monthTitle} · СЕГОДНЯ – ПОСЛЕЗАВТРА`;

      const filteredCities = weatherState.filter(c => {
        if (currentFilter === 'moscow') return c.id === 'moscow';
        if (currentFilter === 'izhevsk') return c.id === 'izhevsk';
        return true;
      });

      container.innerHTML = filteredCities.map(city => {
        const visibleDays = currentFilter === 'today' ? city.days.slice(0, 1) : city.days;

        const rowsHtml = visibleDays.map(day => `
          <div class="day-row">
            <div class="day-main">
              <div>
                <span class="day-name">${day.label}</span>
                <span class="day-date-inline">${day.dateStr}</span>
              </div>
              <div class="day-stats">
                ${formatSignedTemp(day.avgMax)} <span class="night-temp">/ ${formatSignedTemp(day.avgMin)}</span> · <span class="rain-prob">дождь ${day.avgRain}%</span>
              </div>
            </div>
            <div class="day-sub">
              <span>Apple ${formatSignedTemp(day.appleMax)} · Яндекс ${formatSignedTemp(day.yandexMax)}</span>
              <span class="${day.comparison.cls}">${day.comparison.text}</span>
            </div>
          </div>
        `).join('');

        return `
          <article class="card">
            <div class="card-header">
              <h2 class="city-title">${city.name}</h2>
              <span class="badge">Apple + Яндекс · сейчас ${formatSignedTemp(city.currentNow)}</span>
            </div>
            <div class="city-meta">
              ${city.region} · вчера днем ${formatSignedTemp(city.yesterdayAvg)}
            </div>
            <div class="day-list">
              ${rowsHtml}
            </div>
            <div class="card-footer">
              <span>Автообновление каждые 15 мин.</span>
              <button class="refresh-btn" onclick="loadAllWeather()">Обновить сейчас</button>
            </div>
          </article>
        `;
      }).join('');
    }

    async function loadAllWeather() {
      const statusEl = document.getElementById('statusText');
      statusEl.innerHTML = '<span class="dot-live"></span>Обновление данных Apple Weather + Яндекс Погода...';
      try {
        const results = await Promise.all(CITIES.map(fetchCityWeather));
        weatherState = results;
        const nowStr = new Date().toLocaleDateString('ru-RU', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        const timeStr = new Date().toLocaleTimeString('ru-RU', {
          hour: '2-digit',
          minute: '2-digit'
        });
        statusEl.innerHTML = `<span class="dot-live"></span>Средний прогноз · обновлено ${nowStr} в ${timeStr} · Europe/Moscow`;
        render();
      } catch (err) {
        statusEl.textContent = 'Не удалось обновить данные. Проверьте подключение к интернету.';
      }
    }

    document.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadAllWeather();
      }
    });

    setInterval(loadAllWeather, 15 * 60 * 1000);
    loadAllWeather();
  </script>
</body>
</html>
