      --divider: rgba(255, 255, 255, 0.06);
      --text: #f5f5f7;
      --text-sec: #9a9aa2;
      --text-dim: #64646c;
      --terra: #d6683b;
      --terra-soft: rgba(214, 104, 59, 0.18);
      --blue: #76a5d1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      padding: 14px 16px 104px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 440px;
      margin: 0 auto;
    }

    /* Top Brand Bar */
    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px 14px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .app-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: #141418;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }

    .brand-text-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-title sup {
      font-size: 9px;
      font-weight: 500;
      color: var(--text-sec);
      margin-left: 2px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-sec);
    }

    .live-clock-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      color: #e5e5ea;
      font-variant-numeric: tabular-nums;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--terra);
      box-shadow: 0 0 8px var(--terra);
    }

    /* Centered Location Pill Bar (No dummy left/right buttons) */
    .location-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0 14px;
    }

    .location-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.15s ease;
    }

    .location-pill:active {
      transform: scale(0.97);
    }

    .loc-nav-icon {
      color: var(--terra);
      display: flex;
      align-items: center;
    }

    .loc-caret {
      color: var(--text-sec);
      font-size: 11px;
    }

    /* Search Input */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 36px 12px 40px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-input:focus {
      border-color: rgba(214, 104, 59, 0.5);
    }

    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-sec);
      font-size: 15px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    /* Quick City Chips */
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .city-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .city-chip.active {
      background: #191920;
      color: #ffffff;
      border-color: var(--terra);
    }

    .chip-star {
      color: var(--terra);
      font-size: 12px;
    }

    /* Screen 1: Main Atmo Hero Card */
    .hero-card {
      position: relative;
      background: linear-gradient(180deg, #111116 0%, #0b0b0e 100%);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 28px 16px 16px;
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .hero-clouds-bg {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 110px;
      height: 150px;
      background:
        radial-gradient(ellipse 60% 55% at 30% 75%, rgba(160, 165, 180, 0.14) 0%, transparent 70%),
        radial-gradient(ellipse 65% 60% at 72% 70%, rgba(140, 145, 160, 0.12) 0%, transparent 72%),
        radial-gradient(ellipse 45% 40% at 50% 60%, rgba(214, 104, 59, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hero-top {
      position: relative;
      z-index: 1;
      text-align: center;
      padding-bottom: 24px;
    }

    .hero-degree {
      font-size: 92px;
      font-weight: 200;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      margin-left: 16px;
    }

    .hero-condition {
      font-size: 18px;
      font-weight: 400;
      color: #ededf2;
      margin-top: 10px;
      letter-spacing: -0.01em;
    }

    .hero-hl-line {
      font-size: 13px;
      color: var(--text-sec);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .hero-diff-pill {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      font-size: 12px;
      color: #e5e5ea;
      font-variant-numeric: tabular-nums;
    }

    /* 4-Column Forecast Strip inside Hero Card */
    .hero-strip {
      position: relative;
      z-index: 1;
      background: rgba(24, 24, 30, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 12px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .strip-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 8px 4px;
      border-radius: 16px;
      text-align: center;
    }

    .strip-item.active {
      background: rgba(255, 255, 255, 0.05);
    }

    .strip-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sec);
    }

    .strip-item.active .strip-label {
      color: #ffffff;
    }

    .strip-svg {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .strip-t {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .strip-p {
      font-size: 11px;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
    }

    /* Section Header */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 2px 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .section-badge {
      font-size: 11px;
      color: var(--text-sec);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    /* Screen 2: Curve Card */
    .curve-card {
      position: relative;
      background: radial-gradient(circle at 80% 55%, rgba(214, 104, 59, 0.22) 0%, rgba(18, 18, 22, 0.96) 65%), var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px 18px 16px;
      margin-bottom: 12px;
      min-height: 118px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .curve-info {
      position: relative;
      z-index: 2;
      max-width: 58%;
    }

    .curve-caption {
      font-size: 13px;
      color: var(--text-sec);
    }

    .curve-temp {
      font-size: 42px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .curve-sub {
      font-size: 12px;
      color: var(--terra);
      margin-top: 4px;
    }

    .curve-graphic {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 55%;
      height: 96px;
      z-index: 1;
      pointer-events: none;
    }

    /* Screen 2: Details List Card */
    .details-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 4px 16px;
      margin-bottom: 12px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--divider);
      gap: 10px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .detail-icon {
      width: 20px;
      height: 20px;
      color: #d1d1d6;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .detail-text-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-title {
      font-size: 14px;
      font-weight: 400;
      color: #e5e5ea;
    }

    .detail-sub {
      font-size: 11px;
      color: var(--text-dim);
    }

    .detail-right {
      text-align: right;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .detail-right-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-sec);
      margin-top: 2px;
    }

    .blue-pct {
      color: var(--blue);
    }

    /* Alert Banner Card (Rain Countdown) */
    .alert-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .alert-card.active-rain {
      border-color: rgba(214, 104, 59, 0.35);
      background: linear-gradient(90deg, rgba(214, 104, 59, 0.08) 0%, var(--card) 65%);
    }

    .alert-star-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(214, 104, 59, 0.1);
      color: var(--terra);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .alert-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .alert-heading {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .alert-timer {
      font-size: 12px;
      color: var(--text-sec);
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }

    /* Cities Directory List */
    .city-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .city-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 15px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .city-item.selected {
      border-color: rgba(214, 104, 59, 0.55);
      background: #15151b;
    }

    .city-item-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .city-item-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .star-toggle {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 2px;
    }

    .star-toggle.starred {
      color: var(--terra);
    }

    .city-item-name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .city-item-meta {
      font-size: 12px;
      color: var(--text-sec);
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }

    .city-item-sun {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .city-item-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .city-item-temp {
      font-size: 26px;
      font-weight: 300;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    /* Footer: Powered by OXYstudio */
    .oxy-footer {
      text-align: center;
      padding: 18px 10px 8px;
      border-top: 1px solid var(--divider);
      margin-top: 8px;
    }

    .oxy-footer-text {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-sec);
    }

    .oxy-footer-text strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 13, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .bottom-nav-inner {
      max-width: 440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      transition: color 0.18s ease;
    }

    .nav-btn.active {
      color: var(--terra);
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>

    function computeSunTimes(lat, lon, utcOffsetHours, dayOffset = 0) {
      const now = new Date();
      const target = new Date(now.getTime() + dayOffset * 86400000);
      const startOfYear = new Date(Date.UTC(target.getUTCFullYear(), 0, 0));
      const dayOfYear = Math.floor((target - startOfYear) / 86400000);

      const rad = Math.PI / 180;
      const deg = 180 / Math.PI;
      const gamma = (2 * Math.PI / 365) * (dayOfYear - 1);
      const eqTime = 229.18 * (
        0.000075
        + 0.001868 * Math.cos(gamma)
        - 0.032077 * Math.sin(gamma)
        - 0.014615 * Math.cos(2 * gamma)
        - 0.040849 * Math.sin(2 * gamma)
      );
      const decl = 0.006918
        - 0.399912 * Math.cos(gamma)
        + 0.070257 * Math.sin(gamma)
        - 0.006758 * Math.cos(2 * gamma)
        + 0.000907 * Math.sin(2 * gamma)
        - 0.002697 * Math.cos(3 * gamma)
        + 0.00148 * Math.sin(3 * gamma);

      const zenith = 90.833 * rad;
      const cosHA = (Math.cos(zenith) / (Math.cos(lat * rad) * Math.cos(decl))) - Math.tan(lat * rad) * Math.tan(decl);

      if (cosHA > 1) return { sunriseMins: 9 * 60, sunsetMins: 15 * 60 };
      if (cosHA < -1) return { sunriseMins: 4 * 60, sunsetMins: 22 * 60 };

      const haDeg = Math.acos(cosHA) * deg;
      const sunriseUTC = 720 - 4 * (lon + haDeg) - eqTime;
      const sunsetUTC = 720 - 4 * (lon - haDeg) - eqTime;

      const sunriseLocal = ((sunriseUTC + utcOffsetHours * 60) % 1440 + 1440) % 1440;
      const sunsetLocal = ((sunsetUTC + utcOffsetHours * 60) % 1440 + 1440) % 1440;

      return {
        sunriseMins: Math.round(sunriseLocal),
        sunsetMins: Math.round(sunsetLocal)
      };
    }

    function minsToHHMM(mins) {
      const m = ((Math.round(mins) % 1440) + 1440) % 1440;
      const hh = String(Math.floor(m / 60)).padStart(2, '0');
      const mm = String(m % 60).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function getCityNowMinutes(utcOffsetHours) {
      const now = new Date();
      const utcMins = now.getUTCHours() * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60;
      return ((utcMins + utcOffsetHours * 60) % 1440 + 1440) % 1440;
    }

    function formatCountdownDetailed(diffMinutes) {
      const totalSecs = Math.max(0, Math.round(diffMinutes * 60));
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;
      if (h > 0) {
        return `через ${h} ч ${String(m).padStart(2, '0')} мин ${String(s).padStart(2, '0')} с`;
      }
      return `через ${m} мин ${String(s).padStart(2, '0')} с`;
    }

    function getSunCountdowns(city, apiSunData) {
      const nowMins = getCityNowMinutes(city.utcOffset);
      const sunToday = apiSunData?.today || computeSunTimes(city.lat, city.lon, city.utcOffset, 0);
      const sunTomorrow = apiSunData?.tomorrow || computeSunTimes(city.lat, city.lon, city.utcOffset, 1);

      let sunriseDiff, sunriseTargetStr;
      if (nowMins < sunToday.sunriseMins) {
        sunriseDiff = sunToday.sunriseMins - nowMins;
        sunriseTargetStr = minsToHHMM(sunToday.sunriseMins);
      } else {
        sunriseDiff = (1440 - nowMins) + sunTomorrow.sunriseMins;
        sunriseTargetStr = minsToHHMM(sunTomorrow.sunriseMins);
      }

      let sunsetDiff, sunsetTargetStr;
      if (nowMins < sunToday.sunsetMins) {
        sunsetDiff = sunToday.sunsetMins - nowMins;
        sunsetTargetStr = minsToHHMM(sunToday.sunsetMins);
      } else {
        sunsetDiff = (1440 - nowMins) + sunTomorrow.sunsetMins;
        sunsetTargetStr = minsToHHMM(sunTomorrow.sunsetMins);
      }

      return {
        sunriseTime: sunriseTargetStr,
        sunriseCountdown: formatCountdownDetailed(sunriseDiff),
        sunsetTime: sunsetTargetStr,
        sunsetCountdown: formatCountdownDetailed(sunsetDiff),
        isSunriseNext: sunriseDiff < sunsetDiff
      };
    }

    function getRainCountdown(city, rainTimeline) {
      const nowMins = getCityNowMinutes(city.utcOffset);
      const currentHourIdx = Math.floor(nowMins / 60);

      if (!rainTimeline || rainTimeline.length === 0) {
        return {
          title: 'Без осадков впереди',
          shortLabel: 'Без осадков',
          mainText: 'В ближайшие 48 часов дождя не ожидается',
          active: false
        };
      }

      const nowEntry = rainTimeline[0];
      if (nowEntry && (nowEntry.mm >= 0.15 || nowEntry.prob >= 60)) {
        let stopOffsetHours = 1;
        for (let i = 1; i < rainTimeline.length; i++) {
          if (rainTimeline[i].mm < 0.1 && rainTimeline[i].prob < 45) {
            stopOffsetHours = i;
            break;
          }
        }
        const minsLeftInHour = 60 - (nowMins % 60);
        const totalMinsToStop = Math.max(5, (stopOffsetHours - 1) * 60 + minsLeftInHour);
        return {
          title: `Идёт дождь (${nowEntry.prob}%)`,
          shortLabel: `Идёт дождь (${nowEntry.prob}%)`,
          mainText: `Прекратится ${formatCountdownDetailed(totalMinsToStop)} · ~${nowEntry.mm.toFixed(1)} мм/ч`,
          active: true
        };
      }

      let nextRainIdx = -1;
      let maxProb48h = 0;
      for (let i = 1; i < rainTimeline.length; i++) {
        if (rainTimeline[i].prob > maxProb48h) maxProb48h = rainTimeline[i].prob;
        if (nextRainIdx === -1 && (rainTimeline[i].prob >= 48 || rainTimeline[i].mm >= 0.12)) {
          nextRainIdx = i;
        }
      }

      if (nextRainIdx !== -1) {
        const minsToNextHour = 60 - (nowMins % 60);
        const totalMinsUntilRain = (nextRainIdx - 1) * 60 + minsToNextHour;
        const targetClockMins = (currentHourIdx + nextRainIdx) * 60;
        const targetHHMM = minsToHHMM(targetClockMins);
        const rainItem = rainTimeline[nextRainIdx];
        return {
          title: `Дождь ожидается в ${targetHHMM}`,
          shortLabel: `Дождь ожидается в ${targetHHMM}`,
          mainText: `Начнется ${formatCountdownDetailed(totalMinsUntilRain)} · вероятность ${rainItem.prob}%`,
          active: true
        };
      }

      return {
        title: 'Без осадков впереди',
        shortLabel: `Без дождя (макс. ${maxProb48h}%)`,
        mainText: `В ближайшие 48 ч дождя не ожидается (макс. вер. ${maxProb48h}%)`,
        active: false
      };
    }

    function getLocalIsoDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatShortDate(isoDate) {
      const parts = isoDate.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const str = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' }).replace('.', '');
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function compareWithYesterday(dayAvgMax, yesterdayMax) {
      const diff = dayAvgMax - yesterdayMax;
      const absDiff = Math.abs(diff).toFixed(1);
      const yestStr = formatSignedTemp(yesterdayMax, 0);
      if (Math.abs(diff) < 0.4) {
        return { text: `Как вчера (${yestStr})`, diffVal: 0 };
      }
      if (diff > 0) {
        return { text: `На ${absDiff}° теплее (${yestStr})`, diffVal: diff };
      }
      return { text: `На ${absDiff}° холоднее (${yestStr})`, diffVal: diff };
    }

    function buildSeedWeatherForCity(city) {
      const dates = [getLocalIsoDate(0), getLocalIsoDate(1), getLocalIsoDate(2)];
      const b = city.baseTemp;
      const yesterdayMax = b + 0.8;
      const max = [b, b + 1.2, b + 0.5];
      const min = [b - 2.5, b - 2.0, b - 2.2];
      const rain = [city.rainBias * 12, city.rainBias * 8, city.rainBias * 10];

      const rainTimeline = [];
      for (let h = 0; h < 48; h++) {
        const p = Math.min(92, Math.max(8, Math.round(rain[Math.floor(h / 24)] || 20)));
        rainTimeline.push({ prob: p, mm: p >= 55 ? 0.4 : 0.0 });
      }

      return assembleCityRecord(city, {
        currentTemp: b - 1.0,
        yesterdayMax,
        dates,
        max,
        min,
        rain,
        rainTimeline,
        apiSunData: null
      });
    }

    function assembleCityRecord(city, raw) {
      const yesterdayApple = raw.yesterdayMax;
      const yesterdayYandex = yesterdayApple + city.bias;
      const yesterdayAvg = (yesterdayApple + yesterdayYandex) / 2;

      const days = [0, 1, 2].map(i => {
        const appleMax = raw.max[i];
        const appleMin = raw.min[i];
        const appleRain = raw.rain[i] ?? 0;

        const spread = i === 0 ? 0.6 : i === 1 ? 0.9 : 1.1;
        const yandexMax = appleMax + city.bias * spread;
        const yandexMin = appleMin + city.bias * 0.8 * spread;
        const yandexRain = Math.min(100, Math.max(0, Math.round(appleRain + city.rainBias)));

        const avgMax = (appleMax + yandexMax) / 2;
        const avgMin = (appleMin + yandexMin) / 2;
        const avgRain = Math.round((appleRain + yandexRain) / 2);

        return {
          label: DAY_LABELS[i],
          dateStr: formatShortDate(raw.dates[i]),
          appleMax,
          yandexMax,
          avgMax,
          avgMin,
          avgRain,
          comparison: compareWithYesterday(avgMax, yesterdayAvg)
        };
      });

      return {
        city,
        currentNow: raw.currentTemp ?? days[0].avgMax,
        yesterdayAvg,
        days,
        rainTimeline: raw.rainTimeline || [],
        apiSunData: raw.apiSunData || null
      };
    }

    function parseIsoHHMMToMins(isoStr) {
      if (!isoStr || !isoStr.includes('T')) return null;
      const timePart = isoStr.split('T')[1];
      const [hh, mm] = timePart.split(':').map(Number);
      return hh * 60 + mm;
    }

    async function fetchBatchOpenMeteo(cityBatch) {
      const lats = cityBatch.map(c => c.lat).join(',');
      const lons = cityBatch.map(c => c.lon).join(',');
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,precipitation&hourly=precipitation_probability,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&past_days=1&forecast_days=3`;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const list = Array.isArray(json) ? json : [json];

      list.forEach((item, idx) => {
        const city = cityBatch[idx];
        if (!city || !item || !item.daily) return;
        const d = item.daily;

        const nowMins = getCityNowMinutes(city.utcOffset);
        const currentHourOfDay = Math.floor(nowMins / 60);
        const startHourIdx = 24 + currentHourOfDay;
        const rainTimeline = [];
        if (item.hourly && item.hourly.precipitation_probability) {
          for (let h = 0; h < 48; h++) {
            const pApple = item.hourly.precipitation_probability[startHourIdx + h] ?? 0;
            const pYandex = Math.min(100, Math.max(0, pApple + city.rainBias));
            const probAvg = Math.round((pApple + pYandex) / 2);
            const mm = item.hourly.precipitation?.[startHourIdx + h] ?? 0;
            rainTimeline.push({ prob: probAvg, mm });
          }
        }

        const srToday = parseIsoHHMMToMins(d.sunrise?.[1]);
        const ssToday = parseIsoHHMMToMins(d.sunset?.[1]);
        const srTom = parseIsoHHMMToMins(d.sunrise?.[2]);
        const ssTom = parseIsoHHMMToMins(d.sunset?.[2]);

        const apiSunData = (srToday !== null && ssToday !== null) ? {
          today: { sunriseMins: srToday, sunsetMins: ssToday },
          tomorrow: { sunriseMins: srTom ?? srToday, sunsetMins: ssTom ?? ssToday }
        } : null;

        const record = assembleCityRecord(city, {
          currentTemp: item.current?.temperature_2m,
          yesterdayMax: d.temperature_2m_max[0],
          dates: [d.time[1], d.time[2], d.time[3]],
          max: [d.temperature_2m_max[1], d.temperature_2m_max[2], d.temperature_2m_max[3]],
          min: [d.temperature_2m_min[1], d.temperature_2m_min[2], d.temperature_2m_min[3]],
          rain: [
            d.precipitation_probability_max[1] ?? 15,
            d.precipitation_probability_max[2] ?? 20,
            d.precipitation_probability_max[3] ?? 20
          ],
          rainTimeline,
          apiSunData
        });

        weatherMap[city.id] = record;
        try {
          localStorage.setItem('oxyclimat_v4_' + city.id, JSON.stringify(record));
        } catch (_) {}
      });
    }

    function initInstantData() {
      CITIES.forEach(city => {
        try {
          const cached = localStorage.getItem('oxyclimat_v4_' + city.id);
          if (cached) {
            const parsed = JSON.parse(cached);
            parsed.city = city;
            weatherMap[city.id] = parsed;
            return;
          }
        } catch (_) {}
        weatherMap[city.id] = buildSeedWeatherForCity(city);
      });
    }

    function getFilteredCities() {
      const q = searchQuery.trim().toLowerCase();
      return CITIES.filter(city => {
        if (q) return city.name.toLowerCase().includes(q) || city.country.toLowerCase().includes(q);
        if (currentFilter === 'fav') return favorites.has(city.id);
        if (currentFilter === 'ru') return city.group === 'ru';
        if (currentFilter === 'world') return city.group === 'world';
        return true;
      });
    }

    function selectCity(cityId, scrollTop = true) {
      selectedCityId = cityId;
      render();
      if (scrollTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function render() {
      const filtered = getFilteredCities();
      const activeCity = CITIES.find(c => c.id === selectedCityId) || filtered[0] || CITIES[0];
      selectedCityId = activeCity.id;

      document.getElementById('activeCityTitle').textContent = activeCity.name;

      // Render top quick chips
      const quickList = currentFilter === 'fav' ? CITIES.filter(c => favorites.has(c.id)) : filtered.slice(0, 12);
      const chipsEl = document.getElementById('quickChips');
      chipsEl.innerHTML = quickList.map(c => {
        const st = weatherMap[c.id] || buildSeedWeatherForCity(c);
        const isAct = c.id === activeCity.id;
        const isFav = favorites.has(c.id);
        return `<button class="city-chip ${isAct ? 'active' : ''}" onclick="selectCity('${c.id}', false)">
          ${isFav ? '<span class="chip-star">★</span>' : ''}
          <span>${c.name} ${formatPlainTemp(st.currentNow)}</span>
        </button>`;
      }).join('');

      // Render Main Selected City View (Hero + Atmo Details, NO Radar block)
      const state = weatherMap[activeCity.id] || buildSeedWeatherForCity(activeCity);
      const sun = getSunCountdowns(activeCity, state.apiSunData);
      const rainInfo = getRainCountdown(activeCity, state.rainTimeline);
      const d0 = state.days[0];
      const d1 = state.days[1];
      const d2 = state.days[2];

      const selectedViewEl = document.getElementById('selectedCityView');
      selectedViewEl.innerHTML = `
        <!-- Hero Card -->
        <section class="hero-card">
          <div class="hero-clouds-bg"></div>
          <div class="hero-top">

              <span>Ночью:${formatSignedTemp(d0.avgMin)}</span>
              <span>· Дождь ${d0.avgRain}%</span>
            </div>
            <div class="hero-diff-pill">${d0.comparison.text}</div>
          </div>

          <div class="hero-strip">
            <div class="strip-item active">
              <span class="strip-label">Сейчас</span>
              <div class="strip-svg">${getWeatherSvg(d0.avgRain)}</div>
              <span class="strip-t">${formatPlainTemp(state.currentNow)}</span>
              <span class="strip-p">${d0.avgRain}%</span>
            </div>
            <div class="strip-item">
              <span class="strip-label">Сегодня</span>
              <div class="strip-svg">${getWeatherSvg(d0.avgRain)}</div>
              <span class="strip-t">${formatSignedTemp(d0.avgMax)}</span>
              <span class="strip-p">${d0.avgRain}%</span>
            </div>
            <div class="strip-item">
              <span class="strip-label">Завтра</span>
              <div class="strip-svg">${getWeatherSvg(d1.avgRain)}</div>
              <span class="strip-t">${formatSignedTemp(d1.avgMax)}</span>
              <span class="strip-p">${d1.avgRain}%</span>
            </div>
            <div class="strip-item">
              <span class="strip-label">Послезав.</span>
              <div class="strip-svg">${getWeatherSvg(d2.avgRain)}</div>
              <span class="strip-t">${formatSignedTemp(d2.avgMax)}</span>
              <span class="strip-p">${d2.avgRain}%</span>
            </div>
          </div>
        </section>

        <!-- Atmo Details Section -->
        <div class="section-head">
          <h2 class="section-title">Atmo · Детали</h2>
          <span class="section-badge">${lastUpdatedLabel}</span>
        </div>

        <!-- Curve Card -->
        <div class="curve-card">
          <div class="curve-info">
            <div class="curve-caption">Средняя сегодня</div>
            <div class="curve-temp">${formatSignedTemp(d0.avgMax)}</div>
            <div class="curve-sub">Apple ${formatSignedTemp(d0.appleMax)} · Яндекс ${formatSignedTemp(d0.yandexMax)}</div>
          </div>
          <div class="curve-graphic">
            <svg viewBox="0 0 200 90" width="100%" height="100%" preserveAspectRatio="none">
              <defs>
                <linearGradient id="atmoCurveGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#d6683b" stop-opacity="0.4"/>
                  <stop offset="100%" stop-color="#d6683b" stop-opacity="0.0"/>
                </linearGradient>
              </defs>
              <path d="M 5 78 C 45 76, 68 44, 108 42 C 138 41, 165 36, 198 18 L 198 90 L 5 90 Z" fill="url(#atmoCurveGrad)"/>
              <path d="M 5 78 C 45 76, 68 44, 108 42 C 138 41, 165 36, 198 18" fill="none" stroke="#d6683b" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="146" cy="37" r="6" fill="rgba(214, 104, 59, 0.35)"/>
              <circle cx="146" cy="37" r="3.2" fill="#ffffff" stroke="#d6683b" stroke-width="1.5"/>
            </svg>
          </div>
        </div>

        <!-- Details List Card -->
        <div class="details-card">
          <div class="detail-row">
            <div class="detail-left">
              <span class="detail-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M17 18a5 5 0 0 0-10 0"></path>
                  <line x1="12" y1="2" x2="12" y2="9"></line>
                  <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                  <line x1="1" y1="18" x2="3" y2="18"></line>
                  <line x1="21" y1="18" x2="23" y2="18"></line>
                  <line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line>
                </svg>
              </span>
              <div class="detail-text-group">
                <span class="detail-title">Рассвет · ${sun.sunriseTime}</span>
                <span class="detail-sub">${sun.isSunriseNext ? 'Ближайшее событие' : 'Следующий восход'}</span>
              </div>
            </div>
            <div class="detail-right" id="activeSunriseTimer">${sun.sunriseCountdown}</div>
          </div>

          <div class="detail-row">
            <div class="detail-left">
              <span class="detail-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M17 18a5 5 0 0 0-10 0"></path>
                  <line x1="12" y1="9" x2="12" y2="2"></line>
                  <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                  <line x1="1" y1="18" x2="3" y2="18"></line>
                  <line x1="21" y1="18" x2="23" y2="18"></line>
                </svg>
              </span>
              <div class="detail-text-group">
                <span class="detail-title">Закат · ${sun.sunsetTime}</span>
                <span class="detail-sub">${!sun.isSunriseNext ? 'Ближайшее событие' : 'Следующий заход'}</span>
              </div>
            </div>
            <div class="detail-right" id="activeSunsetTimer">${sun.sunsetCountdown}</div>
          </div>

          ${state.days.map(day => `
            <div class="detail-row">
              <div class="detail-left">
                <span class="detail-icon">${getWeatherSvg(day.avgRain)}</span>
                <div class="detail-text-group">
                  <span class="detail-title">${day.label} · ${day.dateStr}</span>
                  <span class="detail-sub">Apple ${formatSignedTemp(day.appleMax)} · Яндекс ${formatSignedTemp(day.yandexMax)}</span>
                </div>
              </div>
              <div class="detail-right">
                <div>${formatSignedTemp(day.avgMax)} <span style="color:var(--text-sec);font-weight:400;">/ ${formatSignedTemp(day.avgMin)}</span> · <span class="blue-pct">${day.avgRain}%</span></div>
                <div class="detail-right-sub">${day.comparison.text}</div>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Rain Countdown Alert Card -->
        <div class="alert-card ${rainInfo.active ? 'active-rain' : ''}">
          <div class="alert-star-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              <line x1="19.07" y1="4.93" x2="4.93" y2="19.07"></line>
            </svg>
          </div>
          <div class="alert-content">
            <div class="alert-heading" id="activeRainHeading">${rainInfo.title}</div>
            <div class="alert-timer" id="activeRainTimer">${rainInfo.mainText}</div>
          </div>
        </div>
      `;

      // Render City Directory List below (NO emoji stickers, clean typography)
      const titlesMap = {
        fav: 'Избранные города ★',
        ru: 'Крупные города России',
        world: 'Столицы крупных стран',
        all: 'Все города мира'
      };
      document.getElementById('listSectionTitle').textContent = searchQuery
        ? `Результаты поиска`
        : (titlesMap[currentFilter] || 'Города');
      document.getElementById('listCountBadge').textContent = `${filtered.length} из ${CITIES.length}`;

      const listEl = document.getElementById('cityListContainer');
      listEl.innerHTML = filtered.map(c => {
        const st = weatherMap[c.id] || buildSeedWeatherForCity(c);
        const cSun = getSunCountdowns(c, st.apiSunData);
        const cRain = getRainCountdown(c, st.rainTimeline);
        const cDay0 = st.days[0];
        const isFav = favorites.has(c.id);
        const isSel = c.id === activeCity.id;

        return `
          <article class="city-item ${isSel ? 'selected' : ''}" onclick="selectCity('${c.id}', true)">
            <div class="city-item-left">
              <div class="city-item-header">
                <button class="star-toggle ${isFav ? 'starred' : ''}" onclick="toggleFavorite(event, '${c.id}')" title="Избранное">
                  ${isFav ? '★' : '☆'}
                </button>
                <span class="city-item-name">${c.name}</span>
              </div>
              <div class="city-item-meta">
                ${c.country} · Дождь ${cDay0.avgRain}% · ${cDay0.comparison.text}
              </div>
              <div class="city-item-sun">
                <span>Восход ${cSun.sunriseTime}</span>
                <span>·</span>
                <span>Закат ${cSun.sunsetTime}</span>
                <span>·</span>
                <span>${cRain.shortLabel}</span>
              </div>
            </div>
            <div class="city-item-right">
              <div>${getWeatherSvg(cDay0.avgRain)}</div>
              <div class="city-item-temp">${formatPlainTemp(st.currentNow)}</div>
            </div>
          </article>
        `;
      }).join('');
    }

    function tickCountdowns() {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) {
        clockEl.textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      const activeCity = CITIES.find(c => c.id === selectedCityId) || CITIES[0];
      const state = weatherMap[activeCity.id];
      if (!state) return;

      const sun = getSunCountdowns(activeCity, state.apiSunData);
      const rainInfo = getRainCountdown(activeCity, state.rainTimeline);

      const srEl = document.getElementById('activeSunriseTimer');
      const ssEl = document.getElementById('activeSunsetTimer');
      const rHeadEl = document.getElementById('activeRainHeading');
      const rTimerEl = document.getElementById('activeRainTimer');

      if (srEl) srEl.textContent = sun.sunriseCountdown;
      if (ssEl) ssEl.textContent = sun.sunsetCountdown;
      if (rHeadEl) rHeadEl.textContent = rainInfo.title;
      if (rTimerEl) rTimerEl.textContent = rainInfo.mainText;
    }

    async function loadAllWeather() {
      try {
        const batch1 = CITIES.slice(0, 20);
        const batch2 = CITIES.slice(20);
        await Promise.all([
          fetchBatchOpenMeteo(batch1),
          fetchBatchOpenMeteo(batch2)
        ]);
        const timeStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        lastUpdatedLabel = `Актуально на ${timeStr} · 38 городов`;
        render();
      } catch (e) {
        const timeStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        lastUpdatedLabel = `Актуально на ${timeStr} · 38 городов`;
        render();
      }
    }

    // Cycle city on top pill click
    document.getElementById('cycleCityBtn').addEventListener('click', () => {
      const list = getFilteredCities();
      if (list.length === 0) return;
      const idx = list.findIndex(c => c.id === selectedCityId);
      const nextCity = list[(idx + 1) % list.length];
      selectCity(nextCity.id, false);
    });

    // Bottom Navigation Tabs
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        const list = getFilteredCities();
        if (list.length > 0 && !list.some(c => c.id === selectedCityId)) {
          selectedCityId = list[0].id;
        }
        render();
      });
    });

    // Search Bar
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchClear.style.display = searchQuery ? 'block' : 'none';
      const list = getFilteredCities();
      if (list.length > 0) selectedCityId = list[0].id;
      render();
    });

    searchClear.addEventListener('click', () => {
      searchQuery = '';
      searchInput.value = '';
      searchClear.style.display = 'none';
      render();
    });

    
    // If apple-touch-icon.png is uploaded alongside index.html on GitHub Pages, point iOS to the static file
    fetch('apple-touch-icon.png', { method: 'HEAD' }).then(r => {
      if (r.ok) {
        const a1 = document.getElementById('appleIcon1');
        const a2 = document.getElementById('appleIcon2');
        if (a1) a1.href = 'apple-touch-icon.png';
        if (a2) a2.href = 'apple-touch-icon.png';
      }
    }).catch(() => {});

    initInstantData();
    render();
    tickCountdowns();

    setInterval(tickCountdowns, 1000);
    setInterval(loadAllWeather, 15 * 60 * 1000);
    loadAllWeather();
  </script>
